version: "3.8"

services:
  # Spring Boot Backend
  backend:
    image: ${ECR_REGISTRY}/hanazoom-backend:${IMAGE_TAG:-latest}
    container_name: hanazoom-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Java 메모리 최적화
      - JAVA_OPTS=-Xmx1024m -Xms512m -XX:MaxMetaspaceSize=256m
      # MySQL (RDS 연결)
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      # Redis (같은 네트워크 내부)
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      # MongoDB (같은 네트워크 내부)
      - SPRING_DATA_MONGODB_HOST=mongodb
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_USERNAME=${MONGO_USERNAME}
      - SPRING_DATA_MONGODB_PASSWORD=${MONGO_PASSWORD}
      - SPRING_DATA_MONGODB_DATABASE=hanazoom_chat
      - SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE=hanazoom_chat
      # Elasticsearch (같은 네트워크 내부)
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      # KIS API
      - KIS_APP_KEY=${KIS_APP_KEY}
      - KIS_APP_SECRET=${KIS_APP_SECRET}
      - KIS_ACCOUNT_CODE=${KIS_ACCOUNT_CODE}
      - KIS_PRODUCT_CODE=${KIS_PRODUCT_CODE}
      # Kakao API
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
      - KAKAO_OAUTH_CLIENT_ID=${KAKAO_OAUTH_CLIENT_ID}
      - KAKAO_OAUTH_CLIENT_SECRET=${KAKAO_OAUTH_CLIENT_SECRET}
      - KAKAO_OAUTH_REDIRECT_URI=${KAKAO_OAUTH_REDIRECT_URI}
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_VALIDITY=3600000
      - JWT_REFRESH_TOKEN_VALIDITY=604800000
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: always
    networks:
      - app-network
    volumes:
      - backend-logs:/var/log/hanazoom
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 1G

  # Redis Service (메모리 최적화)
  redis:
    image: redis:7-alpine
    container_name: hanazoom-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redis1234!}
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis1234!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # MongoDB Service (메모리 최적화)
  mongodb:
    image: mongo:7.0
    container_name: hanazoom-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-admin1234!}
      - MONGO_INITDB_DATABASE=hanazoom_chat
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ../mongodb/init:/docker-entrypoint-initdb.d:ro
    command: mongod --wiredTigerCacheSizeGB 0.5 --auth
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: always
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Elasticsearch Service (메모리 최적화 - Kibana 제거)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: hanazoom-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # 메모리 256MB로 최적화
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
      - cluster.name=hanazoom-cluster
      # 메모리 락 비활성화 (메모리 절약)
      - bootstrap.memory_lock=false
      # 캐시 크기 최적화
      - indices.memory.index_buffer_size=30%
      - indices.fielddata.cache.size=20%
      - indices.queries.cache.size=10%
      # 세그먼트 병합 최적화
      - index.merge.scheduler.max_thread_count=1
      # 샤드 및 복제 설정
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=85%
      - cluster.routing.allocation.disk.watermark.high=90%
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    # Nori 플러그인 설치 (한국어 형태소 분석)
    command: >
      bash -c "
        bin/elasticsearch-plugin list | grep -q analysis-nori || bin/elasticsearch-plugin install analysis-nori --batch;
        /usr/local/bin/docker-entrypoint.sh
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: always
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  elasticsearch_data:
    driver: local
  backend-logs:
    driver: local

networks:
  app-network:
    driver: bridge

